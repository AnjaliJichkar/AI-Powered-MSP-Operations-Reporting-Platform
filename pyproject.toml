[project]
name = "inputiv-engine"
version = "0.1.0"
description = "Inputiv Engine — shared backend for Desk, Resolved and Memory."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.27",
    "cryptography>=43.0",
    # argon2id for password hashing. A memory-hard KDF is not something to
    # write by hand, and `cryptography` does not provide one.
    "argon2-cffi>=23.1",
    "anthropic>=0.40",
    "slack-bolt>=1.21",
    "python-pptx>=1.0",
    # The Monthly Report PDF. Pure Python, one wheel, no system package, so it
    # runs on Render's native runtime; its charts are vector graphics.
    "reportlab>=4.2",
    # Server-rendered pages. There is no build step and no front-end
    # toolchain: a page is a template and a plain JavaScript file.
    "jinja2>=3.1",
    # The IANA time zone database. Windows ships none, so `zoneinfo` cannot
    # load `America/Chicago` without this and the SLA clock would fall back to
    # UTC on a developer's machine while running correctly on Linux.
    "tzdata>=2026.4",
    # Workflow definitions are YAML files (app/automation/definitions/). Already
    # on the machine through uvicorn[standard]; named here because the engine
    # reads it directly.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-reportlab",
    "types-PyYAML",
    # Reads the PDFs the tests render: page counts and text, never a renderer.
    "pypdf>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
# The earlier audit is kept as it was written, for reference; it is not our code style.
extend-exclude = ["scripts/legacy"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "S",         # bandit
    "ASYNC",     # async gotchas
    "RUF",
]
ignore = [
    "S101",  # assert is fine in tests and in internal invariants
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = [
    "E501",
    # A migration builds SQL from literals in the file itself; there is no
    # caller and nothing to inject.
    "S608",
]
"tests/*" = ["S105", "S106", "S107"]
# Product names are printed with the en dashes the template uses.
"app/reports/tbr/config.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
plugins = []

# python-pptx and lxml ship no type information. Only the renderer and the gate
# touch them; strict mode stays on everywhere else.
[[tool.mypy.overrides]]
module = ["lxml", "lxml.*", "pptx", "pptx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.reports.tbr.render", "app.reports.tbr.gate", "app.reports.tbr.pdf"]
disallow_untyped_calls = false
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "postgres: requires a live PostgreSQL database (set TEST_DATABASE_URL)",
]
